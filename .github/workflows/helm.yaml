name: Helm Package & Push

on:
  push:
    tags:
    - '*'

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v2
    - name: Helm lint & package & push
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version
        helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
        helm registry login ${REGISTRY} -u ${ARTIFACTORY_USERNAME} -p ${ARTIFACTORY_PASSWORD}
        make chart
        helm push $(ls *.tgz| head -1) oci://ghcr.io/caas-team/charts
        helm push $(ls *.tgz| head -1) oci://${REGISTRY}/${REPO}
      env:
        ARTIFACTORY_USERNAME: ${{secrets.ARTIFACTORY_USERNAME}}
        ARTIFACTORY_PASSWORD: ${{secrets.ARTIFACTORY_PASSWORD}}
        REGISTRY: artifactory.devops.telekom.de
        REPO: caas-imagetransfers-helmoci-local
