{{- if .Values.caas.customRules.projectFiltering.enabled }}
# Container resource limits/requests recording rules with Rancher project ID filtering
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "caas-cluster-monitoring.fullname" . }}-container-resources
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "caas-cluster-monitoring.name" . }}
    release: {{ .Release.Name }}
spec:
  groups:
  - name: k8s.rules.container_resource_labeled
    rules:
    - expr: |-
                      kube_pod_container_resource_requests{
                        job="kube-state-metrics",
                        resource="memory"
                      } * on (namespace) group_left() (
                        (
                   kube_namespace_labels{
                     label_{
                       .Values.caas.customRules.projectFiltering.labelKey
                       | replace "." "_" | replace "/" "_" | replace "-" "_"
                     }=~"{{ .Values.caas.customRules.projectFiltering.labelValues | join "|" }}"
                   }
                   {{- if .Values.caas.customRules.projectFiltering.additionalNamespaces }}
                   or on (namespace) (
                     kube_namespace_created{namespace=~"{{ .Values.caas.customRules.projectFiltering.additionalNamespaces | join "|" }}"}
                   )
                   {{- end }}
   )
        )
                    record: cluster_namespace_pod_container:kube_pod_container_resource_requests_memory_bytes_labeled
    - expr: |-
                      kube_pod_container_resource_requests{
                        job="kube-state-metrics",
                        resource="cpu"
                      } * on (namespace) group_left() (
                        (
                   kube_namespace_labels{
                     label_{
                       .Values.caas.customRules.projectFiltering.labelKey
                       | replace "." "_" | replace "/" "_" | replace "-" "_"
                     }=~"{{ .Values.caas.customRules.projectFiltering.labelValues | join "|" }}"
                   }
                   {{- if .Values.caas.customRules.projectFiltering.additionalNamespaces }}
                   or on (namespace) (
                     kube_namespace_created{namespace=~"{{ .Values.caas.customRules.projectFiltering.additionalNamespaces | join "|" }}"}
                   )
                   {{- end }}
   )
        )
                    record: cluster_namespace_pod_container:kube_pod_container_resource_requests_cpu_cores_labeled
    - expr: |-
                      kube_pod_container_resource_limits{
                        job="kube-state-metrics",
                        resource="memory"
                      } * on (namespace) group_left() (
                        (
                   kube_namespace_labels{
                     label_{
                       .Values.caas.customRules.projectFiltering.labelKey
                       | replace "." "_" | replace "/" "_" | replace "-" "_"
                     }=~"{{ .Values.caas.customRules.projectFiltering.labelValues | join "|" }}"
                   }
                   {{- if .Values.caas.customRules.projectFiltering.additionalNamespaces }}
                   or on (namespace) (
                     kube_namespace_created{namespace=~"{{ .Values.caas.customRules.projectFiltering.additionalNamespaces | join "|" }}"}
                   )
                   {{- end }}
   )
        )
                    record: cluster_namespace_pod_container:kube_pod_container_resource_limits_memory_bytes_labeled
    - expr: |-
                      kube_pod_container_resource_limits{
                        job="kube-state-metrics",
                        resource="cpu"
                      } * on (namespace) group_left() (
                        (
                   kube_namespace_labels{
                     label_{
                       .Values.caas.customRules.projectFiltering.labelKey
                       | replace "." "_" | replace "/" "_" | replace "-" "_"
                     }=~"{{ .Values.caas.customRules.projectFiltering.labelValues | join "|" }}"
                   }
                   {{- if .Values.caas.customRules.projectFiltering.additionalNamespaces }}
                   or on (namespace) (
                     kube_namespace_created{namespace=~"{{ .Values.caas.customRules.projectFiltering.additionalNamespaces | join "|" }}"}
                   )
                   {{- end }}
   )
        )
                    record: cluster_namespace_pod_container:kube_pod_container_resource_limits_cpu_cores_labeled
{{- end }}